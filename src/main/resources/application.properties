spring.application.name=mejor-vejez-alertas
server.port=${SERVER_PORT:8081}

# URL interna del servicio core (en Dokploy: http://mejor-vejez-api:8080).
mejorvejez.core-url=${CORE_URL:http://localhost:8080}
# Clave compartida entre los microservicios (cabecera X-Clave-Servicio).
# Vacía = las rutas internas rechazan todo (401).
mejorvejez.interno.clave-servicio=${CLAVE_SERVICIO:}

# Correo (SMTP). Si falta MAIL_HOST o MAIL_REMITENTE, cada envío queda FALLIDO
# ("El envío de correo no está configurado."); el servicio igual arranca.
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS:true}
spring.mail.properties.mail.smtp.connectiontimeout=${MAIL_TIMEOUT_MS:10000}
spring.mail.properties.mail.smtp.timeout=${MAIL_TIMEOUT_MS:10000}
spring.mail.properties.mail.smtp.writetimeout=${MAIL_TIMEOUT_MS:10000}
mejorvejez.notificaciones.remitente=${MAIL_REMITENTE:}
mejorvejez.notificaciones.url-app=${APP_URL:http://localhost:4200}
