spring.application.name=mejor-vejez-alertas
server.port=${SERVER_PORT:8081}

# Un apagado o redeploy espera hasta 30 s a que termine la corrida en curso
# (SMTP + confirmación en el core), en vez de interrumpirla a mitad de camino.
spring.task.scheduling.shutdown.await-termination=true
spring.task.scheduling.shutdown.await-termination-period=30s

# URL interna del servicio core (en Dokploy: http://mejor-vejez-api:8080).
mejorvejez.core-url=${CORE_URL:http://localhost:8080}
# Clave compartida entre los microservicios (cabecera X-Clave-Servicio).
# Vacía = las rutas internas rechazan todo (401).
mejorvejez.interno.clave-servicio=${CLAVE_SERVICIO:}

# Apaga los procesos programados (detección de atrasos y alertas preventivas) sin detener el servicio.
mejorvejez.procesos.habilitados=${PROCESOS_HABILITADOS:true}

# Detección de atrasos y alertas preventivas: ventanas y disparo (America/Santiago).
mejorvejez.alertas.horas-retrospectiva=${ALERTAS_HORAS_RETROSPECTIVA:48}
mejorvejez.alertas.horas-cita=${ALERTAS_HORAS_CITA:24}
mejorvejez.alertas.dias-reposicion=${ALERTAS_DIAS_REPOSICION:3}
mejorvejez.alertas.cron-deteccion=${ALERTAS_CRON_DETECCION:0 */5 * * * *}
mejorvejez.alertas.cron-preventivas=${ALERTAS_CRON_PREVENTIVAS:0 10 * * * *}

# Correo (SMTP). Si falta MAIL_HOST o MAIL_REMITENTE, el servicio igual arranca:
# los avisos de alertas no reservan intentos en el core (quedan pendientes hasta
# configurarlo) y el reporte responde cada destinatario con enviado=false
# ("El envío de correo no está configurado."). Se avisa con LOG.warn.
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS:true}
spring.mail.properties.mail.smtp.connectiontimeout=${MAIL_TIMEOUT_MS:10000}
spring.mail.properties.mail.smtp.timeout=${MAIL_TIMEOUT_MS:10000}
spring.mail.properties.mail.smtp.writetimeout=${MAIL_TIMEOUT_MS:10000}
mejorvejez.notificaciones.remitente=${MAIL_REMITENTE:}
mejorvejez.notificaciones.url-app=${APP_URL:http://localhost:4200}
